[pytest]
# "pytest" alone runs the unit tests (no internet). The live tests against
# the real Supabase: "pytest tests_live" (see tests_live/README in the file).
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The '(timeout|verify)' parameter is deprecated
    ignore:X does not have valid feature names
