<!DOCTYPE html>
<!--
  Looz — 3D orchard, shown inside the app with a WebView.

  - Uses plain three.js (three.min.js next to this file, works offline).
  - Tree shapes, instancing, jitter and lights are reused from the old web app
    (_archive/old_3d_web/src/components/Trees.jsx and OrchardScene.jsx).
  - The Flutter app sends the trees by calling: window.loozSetTrees({...})
  - Touch: drag with one finger = rotate, pinch with two fingers = zoom,
    tap a tree = show its name. (Mouse: drag + wheel, for testing on a PC.)
  - No visible text is written here: tree names come from Flutter, so all
    texts stay in app_strings.dart / the data files.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Looz 3D</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #cfe3f0;
      touch-action: none;          /* we handle all touch gestures ourselves */
      -webkit-user-select: none;
      user-select: none;
      font-family: sans-serif;
    }
    canvas { display: block; }
    /* Bubble shown at the top when a tree is tapped. */
    #label {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 24px;
      background: #fffbf2;
      color: #3b2f25;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    #label .dot { width: 22px; height: 22px; border-radius: 50%; }
  </style>
</head>
<body>
  <div id="label"><span class="dot"></span><span class="name"></span></div>

  <script src="three.min.js"></script>
  <script>
  (function () {
    'use strict';

    // ---------------------------------------------------------------
    // 1. Renderer, scene, camera, lights  (kept light for mid-range phones)
    // ---------------------------------------------------------------
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    // Cap the resolution: big win on phones with very dense screens.
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    var SKY = '#cfe3f0';
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(SKY);
    scene.fog = new THREE.Fog(SKY, 150, 400);

    var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 1000);

    // Same light setup as the old OrchardScene.jsx (no shadows, to save battery).
    scene.add(new THREE.HemisphereLight('#bcd4ff', '#6b5a3e', 0.55));
    scene.add(new THREE.AmbientLight('#ffffff', 0.25));
    var sun = new THREE.DirectionalLight('#ffffff', 2.1);
    sun.position.copy(sunDirection(15)).multiplyScalar(100);
    scene.add(sun);

    // Sun position for a given hour (from the old app): east in the morning,
    // south at noon, west in the evening.
    function sunDirection(hour) {
      var t = Math.max(0, Math.min(1, (hour - 6) / 14));
      var az = Math.PI * t;
      var el = Math.sin(Math.PI * t) * 1.15;
      return new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
    }

    // Ground: a big beige field + a darker soil patch under the orchard.
    var ground = new THREE.Mesh(
      new THREE.PlaneGeometry(800, 800),
      new THREE.MeshLambertMaterial({ color: '#c9b48a' })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    var soil = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshLambertMaterial({ color: '#8f7a52' })
    );
    soil.rotation.x = -Math.PI / 2;
    soil.position.y = 0.02;
    scene.add(soil);

    // ---------------------------------------------------------------
    // 2. Trees  (reused from the old Trees.jsx: 2 instanced meshes = 2 draw calls)
    // ---------------------------------------------------------------
    var TRUNK_COLOR = '#5a4632';
    var TRUNK_H = 1.3;
    var CANOPY_R = 1.9;
    var CANOPY_Y = TRUNK_H + CANOPY_R * 0.55;

    var trunkGeo = new THREE.CylinderGeometry(0.15, 0.26, TRUNK_H, 6);
    trunkGeo.translate(0, TRUNK_H / 2, 0);
    var canopyGeo = new THREE.SphereGeometry(CANOPY_R, 10, 7);
    canopyGeo.scale(1, 0.82, 1);
    canopyGeo.translate(0, CANOPY_Y, 0);

    var trunkMat = new THREE.MeshLambertMaterial({ color: TRUNK_COLOR });
    var canopyMat = new THREE.MeshLambertMaterial({ color: '#ffffff' });

    var trunks = null;
    var canopies = null;
    var trees = [];
    var colors = { good: '#4c9a2a', warning: '#e8912d', danger: '#c8442f' };

    // Stable size + rotation per tree, so it never "jumps" (from the old app).
    function jitter(id) {
      var h = 2166136261;
      for (var i = 0; i < id.length; i++) {
        h ^= id.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      var a = ((h >>> 0) % 1000) / 1000;
      var b = ((h >>> 10) % 1000) / 1000;
      return { scale: 0.86 + a * 0.3, spin: b * Math.PI * 2 };
    }

    // Called by Flutter with { colors: {good, warning, danger}, trees: [{name, x, z, health}] }
    function setTrees(data) {
      if (trunks) {
        scene.remove(trunks, canopies);
        trunks.dispose();
        canopies.dispose();
      }
      trees = data.trees || [];
      if (data.colors) colors = data.colors;
      hideLabel();
      if (!trees.length) { requestRender(); return; }

      var n = trees.length;
      trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, n);
      canopies = new THREE.InstancedMesh(canopyGeo, canopyMat, n);

      var m = new THREE.Matrix4();
      var q = new THREE.Quaternion();
      var pos = new THREE.Vector3();
      var scl = new THREE.Vector3();
      var up = new THREE.Vector3(0, 1, 0);
      var col = new THREE.Color();
      var minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;

      for (var i = 0; i < n; i++) {
        var t = trees[i];
        var j = jitter(t.name);
        pos.set(t.x, 0, t.z);
        q.setFromAxisAngle(up, j.spin);
        scl.setScalar(j.scale);
        m.compose(pos, q, scl);
        trunks.setMatrixAt(i, m);
        canopies.setMatrixAt(i, m);
        canopies.setColorAt(i, col.set(colors[t.health] || colors.good));
        minX = Math.min(minX, t.x); maxX = Math.max(maxX, t.x);
        minZ = Math.min(minZ, t.z); maxZ = Math.max(maxZ, t.z);
      }
      trunks.computeBoundingSphere();
      canopies.computeBoundingSphere();
      scene.add(trunks, canopies);

      // Soil patch slightly bigger than the orchard.
      var w = maxX - minX + 12;
      var d = maxZ - minZ + 12;
      soil.scale.set(w, d, 1);
      soil.position.x = (minX + maxX) / 2;
      soil.position.z = (minZ + maxZ) / 2;

      // Frame the whole orchard (same idea as CameraRig in the old app).
      var r = Math.max(w, d);
      target.set(soil.position.x, 0, soil.position.z);
      // Step back far enough that the whole width fits on screen
      // (a phone held upright is narrow, so it needs more distance).
      var halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
      var halfFovX = Math.atan(Math.tan(halfFov) * camera.aspect);
      radius = Math.max(r * 1.05, (w / 2) / Math.tan(halfFovX) + d / 2);
      phi = 0.94;
      theta = 0;
      minRadius = 8;
      maxRadius = r * 3;
      updateCamera();
    }
    window.loozSetTrees = function (data) {
      gotData = true;
      setTrees(data);
    };

    // ---------------------------------------------------------------
    // 3. Touch controls: 1 finger = rotate, 2 fingers = zoom, tap = tree name
    // ---------------------------------------------------------------
    var target = new THREE.Vector3();
    var radius = 100, theta = 0, phi = 0.94;
    var minRadius = 8, maxRadius = 300;

    function updateCamera() {
      // Never go under the ground or straight above.
      phi = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, phi));
      radius = Math.max(minRadius, Math.min(maxRadius, radius));
      camera.position.set(
        target.x + radius * Math.sin(phi) * Math.sin(theta),
        target.y + radius * Math.cos(phi),
        target.z + radius * Math.sin(phi) * Math.cos(theta)
      );
      camera.lookAt(target);
      requestRender();
    }

    var pointers = {};      // active fingers, by pointer id
    var pinchStart = 0;     // distance between 2 fingers when the pinch started
    var radiusStart = 0;
    var moved = 0;          // how much the finger moved (to tell a tap from a drag)

    function pointerCount() { return Object.keys(pointers).length; }
    function pinchDistance() {
      var p = Object.keys(pointers).map(function (k) { return pointers[k]; });
      return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    }

    var el = renderer.domElement;
    el.addEventListener('pointerdown', function (e) {
      el.setPointerCapture(e.pointerId);
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (pointerCount() === 1) moved = 0;
      if (pointerCount() === 2) {
        pinchStart = pinchDistance();
        radiusStart = radius;
        moved = 999; // a pinch is never a tap
      }
    });

    el.addEventListener('pointermove', function (e) {
      var p = pointers[e.pointerId];
      if (!p) return;
      var dx = e.clientX - p.x;
      var dy = e.clientY - p.y;
      p.x = e.clientX;
      p.y = e.clientY;
      if (pointerCount() === 1) {
        moved += Math.abs(dx) + Math.abs(dy);
        theta -= dx * 0.008;
        phi -= dy * 0.008;
        updateCamera();
      } else if (pointerCount() === 2 && pinchStart > 0) {
        radius = radiusStart * pinchStart / Math.max(1, pinchDistance());
        updateCamera();
      }
    });

    function endPointer(e) {
      if (!pointers[e.pointerId]) return;
      var wasTap = pointerCount() === 1 && moved < 8;
      delete pointers[e.pointerId];
      if (pointerCount() < 2) pinchStart = 0;
      if (wasTap) pick(e.clientX, e.clientY);
    }
    el.addEventListener('pointerup', endPointer);
    el.addEventListener('pointercancel', endPointer);

    // Mouse wheel zoom (only for testing on a computer).
    el.addEventListener('wheel', function (e) {
      e.preventDefault();
      radius *= 1 + e.deltaY * 0.001;
      updateCamera();
    }, { passive: false });

    // Tap on a tree -> show its name and health color.
    var raycaster = new THREE.Raycaster();
    var ndc = new THREE.Vector2();
    var label = document.getElementById('label');

    function pick(x, y) {
      if (!canopies) return;
      ndc.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      var hit = raycaster.intersectObject(canopies)[0];
      if (!hit || hit.instanceId == null) { hideLabel(); return; }
      var t = trees[hit.instanceId];
      label.querySelector('.name').textContent = t.name;
      label.querySelector('.dot').style.background = colors[t.health] || colors.good;
      label.style.display = 'flex';
    }
    function hideLabel() { label.style.display = 'none'; }

    // ---------------------------------------------------------------
    // 4. Render only when something changes (saves battery)
    // ---------------------------------------------------------------
    var renderQueued = false;
    function requestRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(function () {
        renderQueued = false;
        renderer.render(scene, camera);
      });
    }

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      requestRender();
    });

    // ---------------------------------------------------------------
    // 5. Demo trees, only if Flutter sent nothing (e.g. page opened in a PC browser)
    // ---------------------------------------------------------------
    var gotData = false;
    setTimeout(function () {
      if (gotData) return;
      var demo = [];
      for (var r = 0; r < 10; r++) {
        for (var c = 0; c < 12; c++) {
          demo.push({ name: 'Arbre ' + (r * 12 + c + 1), x: (c - 5.5) * 6, z: (r - 4.5) * 7, health: 'good' });
        }
      }
      setTrees({ trees: demo });
    }, 1500);

    updateCamera();
  })();
  </script>
</body>
</html>
