<!DOCTYPE html>
<!--
  Looz — 3D orchard: zones, sensor nodes and the layout planner.
  Shown in a WebView on Android / iOS, and in an <iframe> on Flutter web.

  - Planner rebuilt from the React prototype _reference/orchard-planner.jsx, with
    plain three.js (three.min.js next to this file, works offline): plot + field
    with speckled soil, almond trees, AI layout, manual planting, orbit and walk
    views, tree IDs.
  - Zone layer (default view): each zone is a colored area (color = zone health),
    with its sensor node (post + box + antenna, grey when offline). Sensor data
    exists only per zone. Trees are tinted with their zone's color (a tree's
    health = its zone's health). A "!" marker shows above a tree only if its
    latest photo diagnosis is warning / danger.
    Tap a zone (or a tree / node in it) to see its panel.
  - REAL orchard (migration 011): "real": true, the outline drawn by the farmer
    ("orchard.outline": the ground follows it), each zone with its colour and
    type from the designer (trees keep the health tint), nodes "installed" or
    waiting, and texts from the app's ARB files ("texts"). The old planner
    tools (AI layout, manual planting, sizes) are hidden then.
  - Data comes from Flutter (lib/features/orchard_3d/orchard_3d_data.dart):
      1. this page sends "looz:ready",
      2. Flutter answers with window.loozSetOrchard({...}) (WebView)
         or a postMessage of the same JSON (Flutter web iframe).
    Opened alone in a browser, the page only shows the planner (no zones).
  - Lighter than the prototype, for mid-range phones:
      * all trees share 5 "instanced" meshes (5 draw calls instead of ~13 per tree),
      * the picture is only redrawn when something changes.
  - All visible texts are in TXT below (French).
  - Messages sent to Flutter: "looz:ready", and "looz:buttons:hide" /
    "looz:buttons:show" (hide the 2 big buttons while a bottom panel covers them).
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Verger 3D</title>
  <style>
    :root {
      --green: #1E4D35;      /* Looz dark forest green */
      --mint: #E8F5EE;       /* Looz light mint */
      --ink: #1f2a24;
      --muted: #5b6b62;
      --main: #8fa06b;       /* main variety (canopy color) */
      --poll: #c99089;       /* pollinizer (canopy color) */
      --plot: #ab8f66;
      --good: #4C9A2A;       /* replaced by the app colors when data arrives */
      --warning: #E8912D;
      --danger: #C8442F;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #cfe9ef;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #scene { position: absolute; inset: 0; touch-action: none; }
    #scene canvas { display: block; }
    button {
      font: inherit;
      color: inherit;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    svg {
      width: 26px; height: 26px; flex-shrink: 0;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .hidden { display: none !important; }

    /* ---------- Top bar: big icon buttons ---------- */
    #topbar {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      pointer-events: none;            /* only the buttons catch touches */
      transition: left .25s ease;
    }
    #topbar > * { pointer-events: auto; }
    .tool {
      width: 62px; height: 62px; border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      background: var(--mint); color: var(--green);
      font-size: 11px; font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
    }
    .tool.on { background: var(--green); color: #fff; }
    .tool .hash { font-size: 24px; line-height: 26px; font-weight: 800; }
    /* "Zones | Arbres" switch: 2 buttons stuck together */
    .seg { display: flex; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }
    .seg .tool { border-radius: 0; box-shadow: none; }
    #info {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(255, 255, 255, .92); color: var(--green);
      font-size: 15px; font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .12);
    }
    #info .sep { width: 1px; height: 18px; background: #c9d8cf; }
    #hint {
      flex-basis: 100%;
      font-size: 13px; color: var(--green); font-weight: 600;
      text-shadow: 0 1px 2px rgba(255, 255, 255, .9);
      pointer-events: none !important;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot.main { background: var(--main); }
    .dot.poll { background: var(--poll); }
    .dot.plot { background: var(--plot); border-radius: 3px; }

    /* ---------- Bottom sheets (small screens): settings + zone ---------- */
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      max-height: 78%; overflow-y: auto;
      padding: 6px 16px 22px;
      background: #fff;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -4px 18px rgba(0, 0, 0, .2);
      transform: translateY(105%);
      transition: transform .25s ease;
    }
    body.panel-open #panel, body.zone-open #zoneCard { transform: none; }
    .grab { width: 44px; height: 5px; border-radius: 3px; background: #c9d8cf; margin: 4px auto 6px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .panel-head b { font-size: 20px; color: var(--green); }
    .round {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--mint); color: var(--green);
    }
    .row2 { display: flex; gap: 10px; margin-bottom: 14px; }
    .big {
      flex: 1; min-height: 58px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--mint); color: var(--green);
      font-size: 17px; font-weight: 700;
    }
    .big.on { background: var(--green); color: #fff; }
    .box { background: var(--mint); border-radius: 18px; padding: 12px 14px; margin-bottom: 14px; }
    .box .note { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
    .link {
      display: flex; align-items: center; gap: 6px; margin-top: 10px;
      background: none; color: #a0473f; font-size: 15px; font-weight: 700; padding: 6px 0;
    }
    .link svg { width: 22px; height: 22px; }
    .slider { display: block; margin-bottom: 14px; }
    .slider .top { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); }
    .slider .top svg { width: 22px; height: 22px; color: var(--green); }
    .slider .val { margin-left: auto; color: var(--green); font-weight: 800; font-size: 17px; }
    input[type=range] { width: 100%; height: 36px; margin: 2px 0 0; accent-color: var(--green); }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
    .legend span { display: flex; align-items: center; gap: 6px; }

    /* Zone panel */
    .zc-title { display: flex; align-items: center; gap: 12px; }
    .zc-title .dot { width: 26px; height: 26px; }
    .zc-title b { display: block; font-size: 22px; color: var(--ink); }
    #zcHealth { font-size: 16px; font-weight: 700; }
    #zcType { font-size: 16px; font-weight: 600; color: #5b6b62; }
    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 12px; }
    .tile {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 10px 4px; border-radius: 16px; background: var(--mint); color: var(--green);
    }
    .tile svg { width: 30px; height: 30px; }
    .tile b { font-size: 20px; color: var(--ink); white-space: nowrap; }
    .tile b.low { color: var(--danger); }
    .tile span { font-size: 12px; color: var(--muted); font-weight: 600; }
    /* Live zone data not in the plan: lock + "Passer à Connecté" */
    .lockbox { background: var(--mint); border-radius: 18px; padding: 14px; margin-bottom: 8px; }
    .lockbox .zc-line { margin: 0 0 12px; color: var(--ink); }
    .lockbox button {
      width: 100%; min-height: 56px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #D4A62A; color: #fff; font-size: 18px; font-weight: 700;
    }
    .zc-line { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: var(--muted); margin-top: 6px; }
    .zc-line svg { width: 22px; height: 22px; }
    #zcFlag { color: var(--danger); }

    /* Big screens (tablet, computer): settings = sidebar on the left,
       zone panel = card at the bottom. */
    @media (min-width: 720px) {
      #panel {
        top: 0; right: auto; width: 310px; max-height: none;
        border-radius: 0; padding-top: 16px;
        box-shadow: 2px 0 12px rgba(0, 0, 0, .15);
        transform: translateX(-105%);
      }
      #panel .grab { display: none; }
      body.panel-open #topbar { left: 320px; }
      #zoneCard {
        left: 16px; right: auto; bottom: 16px; width: 400px;
        border-radius: 24px; padding-top: 14px;
        transform: translateY(130%);
      }
      #zoneCard .grab { display: none; }
      body.panel-open #zoneCard { left: 326px; }
    }

    /* ---------- Arabic: right to left ---------- */
    html[dir=rtl] .slider .val { margin-left: 0; margin-right: auto; }
    @media (min-width: 720px) {
      html[dir=rtl] #panel {
        left: auto; right: 0; transform: translateX(105%);
        box-shadow: -2px 0 12px rgba(0, 0, 0, .15);
      }
      html[dir=rtl] body.panel-open #panel { transform: none; }
      html[dir=rtl] body.panel-open #topbar { left: 10px; right: 320px; }
      html[dir=rtl] #zoneCard { left: auto; right: 16px; }
      html[dir=rtl] body.panel-open #zoneCard { left: auto; right: 326px; }
    }
    #pad { direction: ltr; }   /* the arrows stay where they point */

    /* ---------- Walk mode: big arrow pad (touch screens) ---------- */
    #pad {
      position: absolute; left: 14px; bottom: 14px;
      display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 6px;
    }
    #pad button {
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(232, 245, 238, .94); color: var(--green);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
      touch-action: none;
    }
    #pad button.held { background: var(--green); color: #fff; }
    #pad svg { width: 36px; height: 36px; stroke-width: 3; }
    #pad [data-dir=up] { grid-column: 2; grid-row: 1; }
    #pad [data-dir=left] { grid-column: 1; grid-row: 2; }
    #pad [data-dir=right] { grid-column: 3; grid-row: 2; }
    #pad [data-dir=down] { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>
  <div id="scene"></div>

  <div id="topbar">
    <button id="btnSettings" class="tool"><svg data-icon="tune"></svg><span data-t="settings"></span></button>
    <button id="btnWalk" class="tool"><svg data-icon="walk"></svg><span data-t="walk"></span></button>
    <button id="btnLabels" class="tool"><span class="hash">#</span><span data-t="ids"></span></button>
    <button id="btnReset" class="tool"><svg data-icon="reset"></svg><span data-t="reset"></span></button>
    <div id="viewSwitch" class="seg hidden">
      <button id="btnZones" class="tool"><svg data-icon="zones"></svg><span data-t="zones"></span></button>
      <button id="btnTrees" class="tool"><svg data-icon="tree"></svg><span data-t="trees"></span></button>
    </div>
    <div id="info">
      <span id="modeText"></span>
      <span class="sep"></span>
      <span class="dot main"></span><span id="nMain">0</span>
      <span class="dot poll"></span><span id="nPoll">0</span>
    </div>
    <div id="hint"></div>
  </div>

  <!-- Settings (planner) -->
  <div id="panel" class="sheet">
    <div class="grab"></div>
    <div class="panel-head">
      <b data-t="settings"></b>
      <button id="btnClose" class="round"><svg data-icon="close"></svg></button>
    </div>

    <div class="row2">
      <button id="btnReal" class="big hidden"><svg data-icon="farm"></svg><span data-t="real"></span></button>
      <button id="btnAI" class="big"><svg data-icon="sparkle"></svg><span data-t="ai"></span></button>
      <button id="btnManual" class="big"><svg data-icon="sprout"></svg><span data-t="manual"></span></button>
    </div>

    <div id="manualBox" class="box">
      <p class="note" data-t="hintManual"></p>
      <div class="row2" style="margin-bottom:0">
        <button id="varMain" class="big"><span class="dot main"></span><span data-t="main"></span></button>
        <button id="varPoll" class="big"><span class="dot poll"></span><span data-t="poll"></span></button>
      </div>
      <button id="btnClear" class="link"><svg data-icon="trash"></svg><span data-t="clear"></span></button>
    </div>

    <label class="slider"><div class="top"><svg data-icon="width"></svg><span data-t="width"></span><span class="val" data-val="plotW"></span></div>
      <input type="range" data-key="plotW" min="12" max="60" step="2"></label>
    <label class="slider"><div class="top"><svg data-icon="length"></svg><span data-t="length"></span><span class="val" data-val="plotL"></span></div>
      <input type="range" data-key="plotL" min="12" max="60" step="2"></label>

    <div id="aiBox">
      <label class="slider"><div class="top"><svg data-icon="treeGap"></svg><span data-t="treeGap"></span><span class="val" data-val="treeGap"></span></div>
        <input type="range" data-key="treeGap" min="4" max="10" step="0.5"></label>
      <label class="slider"><div class="top"><svg data-icon="rowGap"></svg><span data-t="rowGap"></span><span class="val" data-val="rowGap"></span></div>
        <input type="range" data-key="rowGap" min="4" max="10" step="0.5"></label>
      <label class="slider"><div class="top"><span class="dot poll"></span><span data-t="pollEvery"></span><span class="val" data-val="pollEvery"></span></div>
        <input type="range" data-key="pollEvery" min="2" max="6" step="1"></label>
    </div>

    <div class="legend">
      <span><span class="dot main"></span><span data-t="main"></span></span>
      <span><span class="dot poll"></span><span data-t="poll"></span></span>
      <span><span class="dot plot"></span><span data-t="plot"></span></span>
    </div>
  </div>

  <!-- Zone details (tap a zone) -->
  <div id="zoneCard" class="sheet">
    <div class="grab"></div>
    <div class="panel-head">
      <div class="zc-title">
        <span id="zcDot" class="dot"></span>
        <div><b id="zcName"></b><span id="zcHealth"></span><span id="zcType"></span></div>
      </div>
      <button id="zcClose" class="round"><svg data-icon="close"></svg></button>
    </div>
    <div id="zcTiles" class="tiles">
      <div class="tile live"><svg data-icon="drop"></svg><b id="zcMoist"></b><span data-t="moisture"></span></div>
      <div class="tile live"><svg data-icon="thermo"></svg><b id="zcTemp"></b><span data-t="temp"></span></div>
      <div class="tile live"><svg data-icon="battery"></svg><b id="zcBat"></b><span data-t="battery"></span></div>
      <div class="tile"><svg data-icon="tree"></svg><b id="zcTrees"></b><span data-t="trees"></span></div>
    </div>
    <div class="zc-line live"><svg data-icon="node"></svg><span id="zcNodeDot" class="dot"></span><span id="zcNode"></span></div>
    <div id="zcLocked" class="lockbox">
      <div class="zc-line"><svg data-icon="lock"></svg><span data-t="lockedLive"></span></div>
      <button id="zcUpgrade"><svg data-icon="unlock"></svg><span data-t="upgradeConnected"></span></button>
    </div>
    <div id="zcFlag" class="zc-line"><svg data-icon="camera"></svg><span id="zcFlagText"></span></div>
  </div>

  <div id="pad" class="hidden">
    <button data-dir="up"><svg data-icon="up"></svg></button>
    <button data-dir="left"><svg data-icon="left"></svg></button>
    <button data-dir="right"><svg data-icon="right"></svg></button>
    <button data-dir="down"><svg data-icon="down"></svg></button>
  </div>

  <script src="three.min.js"></script>

      camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
      up: '<path d="M6 15l6-6 6 6"/>',
      down: '<path d="M6 9l6 6 6-6"/>',
      left: '<path d="M15 6l-6 6 6 6"/>',
      right: '<path d="M9 6l6 6-6 6"/>'
    };

    function $(id) { return document.getElementById(id); }
    function setIcon(svg, name) {
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.innerHTML = ICONS[name];
    }
    function applyTexts() {
      document.documentElement.lang = LANG;
      document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = TXT[el.dataset.t]; });
    }
    applyTexts();
    document.querySelectorAll('svg[data-icon]').forEach(function (el) { setIcon(el, el.dataset.icon); });

    var isTouch = window.matchMedia('(pointer: coarse)').matches;
    function isWide() { return window.matchMedia('(min-width: 720px)').matches; }

    // ---------------------------------------------------------------
    // 1. State (planner settings and default values as in the prototype)
    // ---------------------------------------------------------------
    var S = {
      mode: 'ai',            // 'real' (orchard from the app) | 'ai' | 'manual'
      view: 'trees',         // 'zones' | 'trees' (zones only once the app sent them)
      cam: 'orbit',          // 'orbit' | 'walk'
      variety: 'main',       // variety planted by hand: 'main' | 'pollinizer'
      plotW: 36, plotL: 36,  // plot size (m)
      treeGap: 6, rowGap: 6, // spacing (m)
      pollEvery: 4,          // one pollinizer row every N rows
      labels: false,
      panelOpen: isWide(),   // settings: sidebar open on big screens, closed on phones
      zoneId: null,          // zone shown in the zone panel (null = closed)
      trees: [],             // [{ id, x, z, variety, zoneId, photo }]  photo = latest photo status
      nextId: 1
    };
    var DATA = null;         // the orchard sent by the app (zones, nodes, trees)
    var REAL = false;        // a real orchard from the database (no planner tools)
    var OUTLINE = null;      // its outline [{x, z}] (null = the rectangle of the planner)
    var SCALE = 1;           // labels and node boxes grow with big orchards
    var LIVE = true;         // live zone data (sensors) in the user's plan ("Connecté")
    var NEUTRAL = '#1E4D35'; // zone color when the health (from sensors) is not in the plan
    var HEALTH = { good: '#4C9A2A', warning: '#E8912D', danger: '#C8442F' };
    var orbit = { theta: Math.PI / 4, phi: Math.PI / 3.4, radius: 62, target: new THREE.Vector3(0, 1, 0) };
    var walker = { x: 0, z: -24, yaw: 0 };
    var keys = {};

    // ---------------------------------------------------------------
    // 2. Renderer, scene, camera, lights
    // ---------------------------------------------------------------
    var sceneEl = $('scene');
    var renderer = new THREE.WebGLRenderer({ antialias: true });
    // Cap the resolution: big win on phones with very dense screens.
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    sceneEl.appendChild(renderer.domElement);
    var canvas = renderer.domElement;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color('#cfe9ef');
    scene.fog = new THREE.Fog('#cfe9ef', 70, 170);

    var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    var sun = new THREE.DirectionalLight(0xfff2d9, 1.1);
    sun.position.set(35, 48, 22);
    sun.castShadow = true;
    var shadowSize = isTouch ? 1024 : 2048;   // smaller shadow map on phones
    sun.shadow.mapSize.set(shadowSize, shadowSize);
    Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55 });
    scene.add(sun);

    // ---------------------------------------------------------------
    // 3. Soil: procedural speckled texture (no image files needed)
    // ---------------------------------------------------------------
    function createSoilTexture(base, speckA, speckB, speckC) {
      var size = 256;
      var c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      var ctx = c.getContext('2d');
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, size, size);

      var colors = [speckA, speckB, speckC];
      var i, x, y, r;
      for (i = 0; i < 1500; i++) {
        x = Math.random() * size;
        y = Math.random() * size;
        r = 0.6 + Math.random() * 2.4;
        ctx.globalAlpha = 0.22 + Math.random() * 0.35;
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      for (i = 0; i < 20; i++) {
        x = Math.random() * size;
        y = Math.random() * size;
        r = 8 + Math.random() * 16;
        var grd = ctx.createRadialGradient(x, y, 0, x, y, r);
        grd.addColorStop(0, colors[Math.floor(Math.random() * colors.length)]);
        grd.addColorStop(1, 'transparent');
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      var tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // Field around the plot (green-ish earth).
    var fieldTex = createSoilTexture('#9caf7c', '#7f9663', '#b7c497', '#6d8353');
    fieldTex.repeat.set(40, 40);
    var field = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 400),
      new THREE.MeshStandardMaterial({ map: fieldTex, roughness: 1 })
    );
    field.rotation.x = -Math.PI / 2;
    field.position.y = -0.01;
    field.receiveShadow = true;
    scene.add(field);

    // The plot (brown earth). A 1 x 1 square, scaled to the plot size.
    var plotTex = createSoilTexture('#ab8f66', '#8f7550', '#c4a273', '#7a6244');
    var plotGeo = new THREE.PlaneGeometry(1, 1);
    plotGeo.rotateX(-Math.PI / 2);
    var plot = new THREE.Mesh(plotGeo, new THREE.MeshStandardMaterial({ map: plotTex, roughness: 1 }));
    plot.receiveShadow = true;
    scene.add(plot);

    function updatePlot() {
      if (OUTLINE) { requestRender(); return; }   // the drawn outline keeps its shape
      plot.scale.set(S.plotW, 1, S.plotL);
      plotTex.repeat.set(S.plotW / 5, S.plotL / 5);
      requestRender();
    }

    // The ground of a real orchard: the outline the farmer drew.
    function setOutline(points) {
      OUTLINE = points;
      var shape = new THREE.Shape(points.map(function (p) { return new THREE.Vector2(p.x, -p.z); }));
      var geo = new THREE.ShapeGeometry(shape);
      geo.rotateX(-Math.PI / 2);
      plot.geometry.dispose();
      plot.geometry = geo;
      plot.scale.set(1, 1, 1);
      plotTex.repeat.set(0.2, 0.2);   // the shape's UVs are in metres: 1 speckle tile per 5 m
      requestRender();
    }

    // A big orchard: wider shadows, field, view distance and bigger labels.
    function fitScene() {
      var size = Math.max(S.plotW, S.plotL);
      SCALE = Math.max(1, size / 40);
      var half = size / 2 + 12;
      Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half, far: Math.max(500, size * 3) });
      sun.shadow.camera.updateProjectionMatrix();
      sun.position.set(35 * SCALE, 48 * SCALE, 22 * SCALE);
      var grow = Math.max(1, size * 4 / 400);
      field.scale.set(grow, grow, 1);
      fieldTex.repeat.set(40 * grow, 40 * grow);
      camera.far = Math.max(1000, size * 8);
      camera.updateProjectionMatrix();
    }

    // ---------------------------------------------------------------
    // 4. Almond trees: short trunk, 3 splayed branches (vase shape),
    //    4 leaf clumps, 5 blossom dots, a darker basin on the ground.
    //    Each part type is ONE InstancedMesh for the whole orchard.
    // ---------------------------------------------------------------
    var VARIETY = {
      main:       { canopy: '#8fa06b', bloom: '#fbf6ea', label: '#6f9a4c' },
      pollinizer: { canopy: '#c99089', bloom: '#f6d7d0', label: '#e08a86' }
    };
    var TRUNK_H = 0.55;

    var trunkGeo = new THREE.CylinderGeometry(0.12, 0.17, TRUNK_H, 8);
    trunkGeo.translate(0, TRUNK_H / 2, 0);
    var branchGeo = new THREE.CylinderGeometry(0.045, 0.09, 1, 6);   // length 1, scaled per branch
    branchGeo.translate(0, 0.5, 0);                                  // base at the origin
    var lobeGeo = new THREE.IcosahedronGeometry(1, 0);               // radius 1, scaled per clump
    var bloomGeo = new THREE.IcosahedronGeometry(0.07, 0);
    var basinGeo = new THREE.RingGeometry(0.2, 0.65, 24);
    basinGeo.rotateX(-Math.PI / 2);
    basinGeo.translate(0, 0.015, 0);

    var trunkMat = new THREE.MeshStandardMaterial({ color: '#a58e6f', roughness: 0.95 });
    var branchMat = new THREE.MeshStandardMaterial({ color: '#ad9678', roughness: 0.95 });
    var canopyMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.85 });  // tinted per tree
    var bloomMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });                       // tinted per tree
    var basinMat = new THREE.MeshBasicMaterial({ color: '#7a6244', transparent: true, opacity: 0.5, side: THREE.DoubleSide });

    // The 3 branches: same angles as the prototype.
    var UP = new THREE.Vector3(0, 1, 0);
    var trunkTop = new THREE.Vector3(0, TRUNK_H, 0);
    var BRANCHES = [
      { angle: 0.3, tilt: 0.62, length: 0.85 },
      { angle: 2.4, tilt: 0.58, length: 0.95 },
      { angle: 4.4, tilt: 0.66, length: 0.8 }
    ];
    var branchLocal = [];   // matrix of each branch, relative to the tree foot
    var lobeCenter = [];    // leaf clump at the tip of each branch
    BRANCHES.forEach(function (b) {
      var dir = new THREE.Vector3(
        Math.sin(b.tilt) * Math.cos(b.angle),
        Math.cos(b.tilt),
        Math.sin(b.tilt) * Math.sin(b.angle)
      ).normalize();
      var q = new THREE.Quaternion().setFromUnitVectors(UP, dir);
      branchLocal.push(new THREE.Matrix4().compose(trunkTop, q, new THREE.Vector3(1, b.length, 1)));
      lobeCenter.push(dir.clone().multiplyScalar(b.length).add(trunkTop).add(new THREE.Vector3(0, 0.15, 0)));
    });
    var centerLobe = new THREE.Vector3(0, TRUNK_H + 0.55, 0);

    // Random numbers that are always the same for a given tree id,
    // so a tree never changes shape when another one is added or removed.
    function seeded(seed) {
      var s = (seed * 2654435761) >>> 0;
      return function () {
        s = (s + 0x6D2B79F5) >>> 0;
        var t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    var treesGroup = new THREE.Group();
    var labelsGroup = new THREE.Group();
    var markersGroup = new THREE.Group();
    scene.add(treesGroup, labelsGroup, markersGroup);
    var treeParts = [];     // the InstancedMeshes now in the scene

    function instanced(geo, mat, perTree, shadow) {
      var mesh = new THREE.InstancedMesh(geo, mat, S.trees.length * perTree);
      mesh.userData.perTree = perTree;   // to find the tree from a clicked instance
      mesh.castShadow = shadow;
      treesGroup.add(mesh);
      treeParts.push(mesh);
      return mesh;
    }

    // Canopy color of a tree. Zone view: tinted with its zone's health
    // (a tree's health = its zone's health). Tree view: variety color.
    var tint = new THREE.Color();
    function canopyColor(t, out) {
      out.set(VARIETY[t.variety].canopy);
      if (S.view !== 'zones' || !LIVE) return out;
      var zone = zoneById(t.zoneId);
      if (zone) out.lerp(tint.set(HEALTH[zone.health]), 0.6);
      return out;
    }

    // Color of a zone: the colour chosen in the designer (else its health),
    // or neutral green if the plan has no live data.
    function zoneColor(zone) { return LIVE ? (zone.color || HEALTH[zone.health]) : NEUTRAL; }

    // Does the latest photo diagnosis of this tree show a problem?
    function photoProblem(t) { return t.photo === 'warning' || t.photo === 'danger'; }

    function rebuildTrees() {
      treeParts.forEach(function (mesh) { treesGroup.remove(mesh); mesh.dispose(); });
      treeParts = [];

      if (S.trees.length) {
        var trunks = instanced(trunkGeo, trunkMat, 1, true);
        var branches = instanced(branchGeo, branchMat, 3, true);
        var lobes = instanced(lobeGeo, canopyMat, 4, true);
        var blooms = instanced(bloomGeo, bloomMat, 5, false);
        var basins = instanced(basinGeo, basinMat, 1, false);

        var foot = new THREE.Matrix4();
        var m = new THREE.Matrix4();
        var p = new THREE.Vector3();
        var q = new THREE.Quaternion();
        var s = new THREE.Vector3();
        var c = new THREE.Color();

        S.trees.forEach(function (t, i) {
          // Trees from the planner get the zone they stand in.
          if (t.zoneId === undefined) t.zoneId = zoneAt(t.x, t.z);
          var rand = seeded(t.id);
          var v = VARIETY[t.variety];
          foot.makeTranslation(t.x, 0, t.z);
          trunks.setMatrixAt(i, foot);
          basins.setMatrixAt(i, foot);

          // 3 branches + a leaf clump at the end of each, then the center clump.
          canopyColor(t, c);
          for (var b = 0; b < 3; b++) {
            branches.setMatrixAt(i * 3 + b, m.multiplyMatrices(foot, branchLocal[b]));
            p.set(t.x + lobeCenter[b].x, lobeCenter[b].y, t.z + lobeCenter[b].z);
            lobes.setMatrixAt(i * 4 + b, m.compose(p, q, s.setScalar(0.5 + rand() * 0.1)));
            lobes.setColorAt(i * 4 + b, c);
          }
          p.set(t.x, centerLobe.y, t.z);
          lobes.setMatrixAt(i * 4 + 3, m.compose(p, q, s.setScalar(0.42)));
          lobes.setColorAt(i * 4 + 3, c);

          // 5 small blossom dots.
          c.set(v.bloom);
          for (var k = 0; k < 5; k++) {
            var a = rand() * Math.PI * 2;
            var h = TRUNK_H + 0.3 + rand() * 0.95;
            var r = 0.35 + rand() * 0.35;
            blooms.setMatrixAt(i * 5 + k, m.makeTranslation(t.x + Math.cos(a) * r, h, t.z + Math.sin(a) * r));
            blooms.setColorAt(i * 5 + k, c);
          }
        });
        treeParts.forEach(function (mesh) { mesh.computeBoundingSphere(); });
      }
      rebuildLabels();
      rebuildMarkers();
      refreshUI();
      requestRender();
    }

    // ---------------------------------------------------------------
    // 5. Labels: tree IDs ("#12"), zone names, warning markers
    // ---------------------------------------------------------------
    function canvasSprite(w, h, draw) {
      var c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      draw(c.getContext('2d'));
      var tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;   // true colors (not washed out)
      return new THREE.SpriteMaterial({ map: tex });
    }

    // The name of a zone, on a white pill with the zone's color.
    function zoneLabelMaterial(zone) {
      return canvasSprite(256, 96, function (ctx) {
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath();
        ctx.roundRect(4, 4, 248, 88, 44);
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = zoneColor(zone);
        ctx.stroke();
        ctx.fillStyle = '#1f2a24';
        ctx.font = 'bold 44px sans-serif';
        ctx.direction = LANG === 'ar' ? 'rtl' : 'ltr';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(zone.name, 128, 50);
      });
    }

    var labelCache = {};   // "id|variety" -> SpriteMaterial (reused between rebuilds)

    function labelMaterial(t) {
      var key = t.id + '|' + t.variety;
      if (!labelCache[key]) {
        labelCache[key] = canvasSprite(128, 64, function (ctx) {
          ctx.fillStyle = 'rgba(255,255,255,0.96)';
          ctx.fillRect(0, 0, 128, 64);
          ctx.lineWidth = 5;
          ctx.strokeStyle = VARIETY[t.variety].label;
          ctx.strokeRect(3, 3, 122, 58);
          ctx.fillStyle = '#292524';
          ctx.font = 'bold 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('#' + t.id, 64, 34);
        });
      }
      return labelCache[key];
    }

    function rebuildLabels() {
      labelsGroup.clear();
      var used = {};
      if (S.labels) {
        S.trees.forEach(function (t, i) {
          var sprite = new THREE.Sprite(labelMaterial(t));
          sprite.scale.set(1.15, 0.58, 1);
          sprite.position.set(t.x, 2.55, t.z);
          sprite.userData.index = i;
          labelsGroup.add(sprite);
          used[t.id + '|' + t.variety] = true;
        });
      }
      // Free the labels that are not shown anymore.
      Object.keys(labelCache).forEach(function (key) {
        if (!used[key]) {
          labelCache[key].map.dispose();
          labelCache[key].dispose();
          delete labelCache[key];
        }
      });
    }

    // Round "!" marker above a tree whose latest photo shows a problem (zone view only).
    var markerCache = {};
    function markerMaterial(level) {
      if (!markerCache[level]) {
        markerCache[level] = canvasSprite(64, 64, function (ctx) {
          ctx.fillStyle = HEALTH[level];
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(32, 32, 27, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 40px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('!', 32, 35);
        });
      }
      return markerCache[level];
    }

    function rebuildMarkers() {
      markersGroup.clear();
      if (S.view !== 'zones') return;
      S.trees.forEach(function (t, i) {
        if (!photoProblem(t)) return;
        var sprite = new THREE.Sprite(markerMaterial(t.photo));
        var big = Math.min(SCALE, 2.5);
        sprite.scale.set(1.4 * big, 1.4 * big, 1);
        sprite.position.set(t.x, (S.labels ? 3.6 : 3) + big - 1, t.z);   // above the ID label
        sprite.userData.index = i;
        markersGroup.add(sprite);
      });
    }

    // ---------------------------------------------------------------
    // 6. Zones: colored areas with a border, a name, and a sensor node
    // ---------------------------------------------------------------
    var zonesGroup = new THREE.Group();
    var nodesGroup = new THREE.Group();
    scene.add(zonesGroup, nodesGroup);
    var ZONES = [];          // [{ id, name, health, points, node, fill, label }]

    function zoneById(id) {
      for (var i = 0; i < ZONES.length; i++) if (ZONES[i].id === id) return ZONES[i];
      return null;
    }

    // Is (x, z) inside the polygon? (classic "ray crossing" test)
    function inside(points, x, z) {
      var result = false;
      for (var i = 0, j = points.length - 1; i < points.length; j = i++) {
        var a = points[i], b = points[j];
        if ((a.z > z) !== (b.z > z) && x < (b.x - a.x) * (z - a.z) / (b.z - a.z) + a.x) result = !result;
      }
      return result;
    }
    function zoneAt(x, z) {
      for (var i = 0; i < ZONES.length; i++) if (inside(ZONES[i].points, x, z)) return ZONES[i].id;
      return null;
    }

    var edgeGeo = new THREE.BoxGeometry(1, 0.06, 0.35);         // border strip, scaled to each side
    var cornerGeo = new THREE.CylinderGeometry(0.175, 0.175, 0.06, 12);

    function buildZones() {
      zonesGroup.clear();
      var edges = [];
      ZONES.forEach(function (zone) {
        var pts = zone.points;
        // Fill: a flat shape on the ground, slightly transparent.
        var shape = new THREE.Shape(pts.map(function (p) { return new THREE.Vector2(p.x, -p.z); }));
        var geo = new THREE.ShapeGeometry(shape);
        geo.rotateX(-Math.PI / 2);
        zone.fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
          color: zoneColor(zone), transparent: true, opacity: 0.32, depthWrite: false,
          polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
        }));
        zone.fill.position.y = 0.03;
        zone.fill.userData.zoneId = zone.id;
        zonesGroup.add(zone.fill);

        // Border: one strip per side + a round piece at each corner.
        pts.forEach(function (a, i) {
          edges.push({ a: a, b: pts[(i + 1) % pts.length], zone: zone });
        });

        // Name floating above the zone.
        var cx = 0, cz = 0;
        pts.forEach(function (p) { cx += p.x; cz += p.z; });
        zone.label = new THREE.Sprite(zoneLabelMaterial(zone));
        zone.label.scale.set(6 * SCALE, 2.25 * SCALE, 1);
        zone.label.position.set(cx / pts.length, 6 + 2 * SCALE, cz / pts.length);   // high enough not to hide tree markers
        zone.label.userData.zoneId = zone.id;
        zonesGroup.add(zone.label);
      });

      // All borders of all zones: 2 instanced meshes.
      var strips = new THREE.InstancedMesh(edgeGeo, new THREE.MeshBasicMaterial(), edges.length);
      var corners = new THREE.InstancedMesh(cornerGeo, new THREE.MeshBasicMaterial(), edges.length);
      var m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
      edges.forEach(function (e, i) {
        var dx = e.b.x - e.a.x, dz = e.b.z - e.a.z;
        var len = Math.hypot(dx, dz);
        q.setFromAxisAngle(UP, Math.atan2(-dz, dx));
        m.compose(new THREE.Vector3((e.a.x + e.b.x) / 2, 0.06, (e.a.z + e.b.z) / 2), q, new THREE.Vector3(len, 1, 1));
        strips.setMatrixAt(i, m);
        c.set(zoneColor(e.zone)).multiplyScalar(0.75);   // a bit darker than the fill
        strips.setColorAt(i, c);
        corners.setMatrixAt(i, m.makeTranslation(e.a.x, 0.06, e.a.z));
        corners.setColorAt(i, c);
      });
      zonesGroup.add(strips, corners);
    }

    // Sensor node: a post, a box with an antenna and a small light on top.
    var postGeo = new THREE.CylinderGeometry(0.06, 0.08, 1.5, 8);
    postGeo.translate(0, 0.75, 0);
    var boxGeo = new THREE.BoxGeometry(0.5, 0.36, 0.3);
    boxGeo.translate(0, 1.68, 0);
    var antennaGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.6, 6);
    antennaGeo.translate(0.16, 2.16, 0);
    var lightGeo = new THREE.SphereGeometry(0.06, 8, 6);
    lightGeo.translate(0.16, 2.48, 0);
    var NODE_MAT = {
      online: {
        post: new THREE.MeshStandardMaterial({ color: '#8a8f94', roughness: 0.6 }),
        box: new THREE.MeshStandardMaterial({ color: '#1E4D35', roughness: 0.5 }),
        antenna: new THREE.MeshStandardMaterial({ color: '#3d4246' }),
        light: new THREE.MeshBasicMaterial({ color: '#57d16b' })
      },
      offline: {   // greyed out
        post: new THREE.MeshStandardMaterial({ color: '#a3a6a9', roughness: 0.8 }),
        box: new THREE.MeshStandardMaterial({ color: '#9aa0a6', roughness: 0.8 }),
        antenna: new THREE.MeshStandardMaterial({ color: '#8d9195' }),
        light: new THREE.MeshBasicMaterial({ color: '#6b6f73' })
      }
    };

    function buildNodes() {
      nodesGroup.clear();
      ZONES.forEach(function (zone) {
        var n = zone.node;
        if (!n) return;
        var mat = NODE_MAT[n.status === 'online' ? 'online' : 'offline'];
        var group = new THREE.Group();
        [[postGeo, mat.post], [boxGeo, mat.box], [antennaGeo, mat.antenna], [lightGeo, mat.light]].forEach(function (part) {
          var mesh = new THREE.Mesh(part[0], part[1]);
          mesh.castShadow = true;
          mesh.userData.zoneId = zone.id;
          group.add(mesh);
        });
        group.position.set(n.position_x, 0, n.position_z);
        group.scale.setScalar(1.6 * Math.min(SCALE, 4));   // bigger than real, so it is easy to spot and tap
        nodesGroup.add(group);
      });
    }

    function highlightZone() {
      ZONES.forEach(function (zone) {
        zone.fill.material.opacity = zone.id === S.zoneId ? 0.55 : 0.32;
      });
      requestRender();
    }

    // ---------------------------------------------------------------
    // 7. Orchard data from the app
    // ---------------------------------------------------------------
    function setOrchard(data) {
      DATA = data;
      LIVE = data.live !== false;
      REAL = data.real === true;
      if (REAL) S.panelOpen = false;
      // New texts from the app (its ARB files), in both languages.
      if (data.texts) {
        Object.keys(data.texts).forEach(function (l) { if (TXTS[l]) Object.assign(TXTS[l], data.texts[l]); });
      }
      if (data.colors) {
        HEALTH = data.colors;
        Object.keys(HEALTH).forEach(function (k) { document.documentElement.style.setProperty('--' + k, HEALTH[k]); });
      }
      if (data.orchard) {
        S.plotW = data.orchard.width;
        S.plotL = data.orchard.length;
        if (data.orchard.outline && data.orchard.outline.length >= 3) setOutline(data.orchard.outline);
        syncSliders();
        updatePlot();
        fitScene();
      }
      if (data.lang) setLanguage(data.lang, true);
      ZONES = (data.zones || []).map(function (z) {
        return { id: z.id, names: z.names, name: zoneName(z), health: z.health, color: z.color || null,
                 type: z.type || null, points: z.boundary, node: null };
      });
      (data.nodes || []).forEach(function (n) {
        var zone = zoneById(n.zone_id);
        if (zone) zone.node = n;
      });
      buildZones();
      buildNodes();
      S.view = ZONES.length ? 'zones' : 'trees';
      loadRealTrees();
      resetView();
    }
    window.loozSetOrchard = setOrchard;

    function zoneName(zone) { return (zone.names && zone.names[LANG]) || zone.name; }

    // Switches every text of the page to 'ar' or 'fr' (the scene does not change).
    function setLanguage(lang, quiet) {
      LANG = lang === 'fr' ? 'fr' : 'ar';
      TXT = TXTS[LANG];
      applyTexts();
      syncSliders();
      ZONES.forEach(function (zone) {
        zone.name = zoneName(zone);
        if (zone.label) {
          var old = zone.label.material;
          zone.label.material = zoneLabelMaterial(zone);
          old.map.dispose();
          old.dispose();
        }
      });
      if (quiet) return;
      if (S.zoneId) openZone(S.zoneId); else refreshUI();
    }
    window.loozSetLanguage = setLanguage;

    // Flutter web: the data arrives as a message from the parent page.
    window.addEventListener('message', function (e) {
      if (e.source !== window.parent || typeof e.data !== 'string') return;
      try {
        var data = JSON.parse(e.data);
        if (data && data.zones) setOrchard(data);
        else if (data && data.looz_lang) setLanguage(data.looz_lang);
      } catch (err) { /* not our message */ }
    });

    // Back to the real orchard (the trees sent by the app).
    function loadRealTrees() {
      S.mode = 'real';
      S.trees = (DATA.trees || []).map(function (t) {
        return { id: t.id, x: t.x, z: t.z, variety: t.variety || 'main', zoneId: t.zone_id, photo: t.photo_status || null };
      });
      S.nextId = S.trees.reduce(function (max, t) { return Math.max(max, t.id); }, 0) + 1;
      rebuildTrees();
    }

    // ---------------------------------------------------------------
    // 8. AI layout: rows across the plot, one pollinizer row every N rows
    // ---------------------------------------------------------------
    function generateLayout() {
      var halfW = S.plotW / 2;
      var halfL = S.plotL / 2;
      var cols = Math.max(1, Math.floor(S.plotW / S.treeGap) + 1);
      var rows = Math.max(1, Math.floor(S.plotL / S.rowGap) + 1);
      var trees = [];
      var id = 1;
      for (var r = 0; r < rows; r++) {
        var z = -halfL + r * S.rowGap;
        if (z > halfL + 0.001) continue;
        var isPollinizerRow = S.pollEvery > 0 && (r + 1) % S.pollEvery === 0;
        for (var c = 0; c < cols; c++) {
          var x = -halfW + c * S.treeGap;
          if (x > halfW + 0.001) continue;
          trees.push({ id: id++, x: x, z: z, variety: isPollinizerRow ? 'pollinizer' : 'main' });
        }
      }
      S.nextId = id;
      S.trees = trees;
      rebuildTrees();
    }

    // ---------------------------------------------------------------
    // 9. Cameras: orbit (around the plot) and walk (eye height)
    // ---------------------------------------------------------------
    var MIN_RADIUS = 14;
    var maxRadius = 130;

    // Distance needed to see the whole plot (a phone held upright is narrow).
    function fitRadius() {
      var halfFovX = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
      var span = (S.plotW + S.plotL) / Math.SQRT2 + 6;   // plot seen at 45 degrees
      return (span / 2) / Math.tan(halfFovX);
    }

    function resetWalker() {
      walker = { x: 0, z: -(S.plotL / 2) - 6, yaw: 0 };
    }

    function resetView() {
      maxRadius = Math.max(130, fitRadius() * 1.3);
      orbit.theta = Math.PI / 4;
      orbit.phi = Math.PI / 3.4;
      orbit.radius = Math.min(maxRadius, Math.max(62, fitRadius()));
      scene.fog.near = Math.max(70, orbit.radius * 0.9);
      scene.fog.far = Math.max(170, orbit.radius * 2.6);
      resetWalker();
      requestRender();
    }

    function placeCamera() {
      if (S.cam === 'walk') {
        var fx = Math.sin(walker.yaw);
        var fz = Math.cos(walker.yaw);
        camera.position.set(walker.x, 1.7, walker.z);
        camera.lookAt(walker.x + fx, 1.7, walker.z + fz);
      } else {
        var o = orbit;
        camera.position.set(
          o.target.x + o.radius * Math.sin(o.phi) * Math.sin(o.theta),
          o.target.y + o.radius * Math.cos(o.phi),
          o.target.z + o.radius * Math.sin(o.phi) * Math.cos(o.theta)
        );
        camera.lookAt(o.target);
      }
    }

    // Walk one step (returns true if the walker moved or turned).
    function stepWalk(dt) {
      var turnSpeed = 1.7;
      var moveSpeed = 8;
      var moved = false;
      if (keys.left) { walker.yaw += turnSpeed * dt; moved = true; }
      if (keys.right) { walker.yaw -= turnSpeed * dt; moved = true; }
      var fx = Math.sin(walker.yaw);
      var fz = Math.cos(walker.yaw);
      if (keys.up) { walker.x += fx * moveSpeed * dt; walker.z += fz * moveSpeed * dt; moved = true; }
      if (keys.down) { walker.x -= fx * moveSpeed * dt; walker.z -= fz * moveSpeed * dt; moved = true; }
      var limit = 185;
      walker.x = Math.max(-limit, Math.min(limit, walker.x));
      walker.z = Math.max(-limit, Math.min(limit, walker.z));
      return moved;
    }

    // ---------------------------------------------------------------
    // 10. Render loop: only draws when something changed (saves battery)
    // ---------------------------------------------------------------
    var dirty = true;
    function requestRender() { dirty = true; }

    var clock = new THREE.Clock();
    function frame() {
      requestAnimationFrame(frame);
      var dt = Math.min(clock.getDelta(), 0.05);
      if (S.cam === 'walk' && stepWalk(dt)) dirty = true;
      if (!dirty) return;
      dirty = false;
      placeCamera();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      maxRadius = Math.max(130, fitRadius() * 1.3);
      refreshUI();
      requestRender();
    });

    // ---------------------------------------------------------------
    // 11. Touch / mouse on the 3D view
    //     1 finger or mouse drag = rotate, 2 fingers = zoom, wheel = zoom,
    //     tap: zone view = zone panel, manual mode = plant / remove a tree.
    // ---------------------------------------------------------------
    var pointers = {};
    var moved = 0;
    var pinchStart = 0;
    var radiusStart = 0;

    function pointerCount() { return Object.keys(pointers).length; }
    function pinchDistance() {
      var p = Object.keys(pointers).map(function (k) { return pointers[k]; });
      return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    }
    function setRadius(r) {
      orbit.radius = Math.min(maxRadius, Math.max(MIN_RADIUS, r));
      requestRender();
    }

    canvas.addEventListener('pointerdown', function (e) {
      if (S.cam !== 'orbit') return;
      canvas.setPointerCapture(e.pointerId);
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      if (pointerCount() === 1) moved = 0;
      if (pointerCount() === 2) {
        pinchStart = pinchDistance();
        radiusStart = orbit.radius;
        moved = 999;   // a pinch is never a tap
      }
    });

    canvas.addEventListener('pointermove', function (e) {
      var p = pointers[e.pointerId];
      if (!p) return;
      var dx = e.clientX - p.x;
      var dy = e.clientY - p.y;
      p.x = e.clientX;
      p.y = e.clientY;
      if (pointerCount() === 1) {
        moved += Math.abs(dx) + Math.abs(dy);
        orbit.theta -= dx * 0.0065;
        orbit.phi = Math.min(Math.PI / 2 - 0.05, Math.max(0.2, orbit.phi - dy * 0.0065));
        requestRender();
      } else if (pointerCount() === 2 && pinchStart > 0) {
        setRadius(radiusStart * pinchStart / Math.max(1, pinchDistance()));
      }
    });

    function endPointer(e) {
      if (!pointers[e.pointerId]) return;
      var wasTap = pointerCount() === 1 && moved < (isTouch ? 10 : 5);
      delete pointers[e.pointerId];
      if (pointerCount() < 2) pinchStart = 0;
      if (wasTap) handleTap(e.clientX, e.clientY);
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);

    canvas.addEventListener('wheel', function (e) {
      if (S.cam !== 'orbit') return;
      e.preventDefault();
      setRadius(orbit.radius + e.deltaY * 0.05);
    }, { passive: false });

    var raycaster = new THREE.Raycaster();
    var ndc = new THREE.Vector2();

    // Which tree is this hit? (an instance of a tree part, an ID label or a marker)
    function treeIndexOf(hit) {
      return hit.object.isSprite
        ? hit.object.userData.index
        : Math.floor(hit.instanceId / hit.object.userData.perTree);
    }

    function handleTap(x, y) {
      if (S.cam !== 'orbit') return;
      var rect = canvas.getBoundingClientRect();
      ndc.set(((x - rect.left) / rect.width) * 2 - 1, -((y - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);

      // Zone view: tap a zone, its node or one of its trees -> zone panel.
      if (S.view === 'zones') {
        var targets = nodesGroup.children.concat(markersGroup.children, labelsGroup.children, treeParts, zonesGroup.children);
        var hits = raycaster.intersectObjects(targets, true);
        var zoneId = null;
        for (var i = 0; i < hits.length && !zoneId; i++) {
          var o = hits[i].object;
          if (o.userData.zoneId) zoneId = o.userData.zoneId;
          else if (o.userData.perTree || o.isSprite) zoneId = S.trees[treeIndexOf(hits[i])].zoneId;
        }
        openZone(zoneId || null);
        return;
      }

      if (S.mode !== 'manual') return;
      // Tapped a tree (or its label)? -> remove it.
      var hit = raycaster.intersectObjects(treeParts.concat(labelsGroup.children), false)[0];
      if (hit) {
        S.trees.splice(treeIndexOf(hit), 1);
        rebuildTrees();
        return;
      }
      // Tapped the plot? -> plant a tree of the chosen variety.
      var ground = raycaster.intersectObject(plot)[0];
      if (ground) {
        S.trees.push({ id: S.nextId++, x: ground.point.x, z: ground.point.z, variety: S.variety });
        rebuildTrees();
      }
    }

    // ---------------------------------------------------------------
    // 12. Zone panel
    // ---------------------------------------------------------------
    function timeAgo(iso) {
      var minutes = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
      if (minutes < 60) return TXT.ago + minutes + TXT.min;
      if (minutes < 48 * 60) return TXT.ago + Math.round(minutes / 60) + TXT.hours;
      return TXT.ago + Math.round(minutes / 1440) + TXT.days;
    }

    function openZone(id) {
      S.zoneId = id;
      if (id && !isWide()) S.panelOpen = false;   // one bottom sheet at a time
      var zone = zoneById(id);
      if (zone) {
        var n = zone.node;
        $('zcDot').style.background = zoneColor(zone);
        $('zcName').textContent = zone.name;
        $('zcHealth').textContent = LIVE ? TXT.health[zone.health] : '';
        $('zcHealth').style.color = HEALTH[zone.health];
        $('zcType').textContent = zone.type && TXT.types && TXT.types[zone.type] ? ' · ' + TXT.types[zone.type] : '';
        // Live zone data not in the plan: a lock + "Passer à Connecté" instead.
        document.querySelectorAll('#zoneCard .live').forEach(function (el) { el.classList.toggle('hidden', !LIVE); });
        show('zcLocked', !LIVE);
        $('zcTiles').style.gridTemplateColumns = LIVE ? '' : '1fr';
        // No readings yet (they will come from the readings database): "قريبًا".
        $('zcMoist').textContent = n && n.soil_moisture != null ? Math.round(n.soil_moisture) + ' %' : (TXT.soon || '—');
        $('zcTemp').textContent = n && n.temperature != null ? n.temperature.toFixed(1) + '°' : (TXT.soon || '—');
        $('zcBat').textContent = n && n.battery != null ? n.battery + ' %' : '—';
        $('zcBat').classList.toggle('low', !!n && n.battery != null && n.battery < 20);
        var inZone = S.trees.filter(function (t) { return t.zoneId === id; });
        $('zcTrees').textContent = inZone.length;
        var waiting = !!n && n.installed === false;   // the technician did not come yet
        var online = n && n.status === 'online' && !waiting;
        $('zcNodeDot').style.background = online ? '#57d16b' : '#9aa0a6';
        $('zcNode').textContent = !n ? '—'
          : waiting ? (TXT.nodeWaiting || TXT.offline)
          : (online ? TXT.online : TXT.offline) + (n.last_seen ? ' · ' + timeAgo(n.last_seen) : '');
        var flagged = inZone.filter(photoProblem);
        show('zcFlag', flagged.length > 0);
        $('zcFlagText').textContent = TXT.check + flagged.map(function (t) { return '#' + t.id; }).join(', ');
      }
      highlightZone();
      refreshUI();
    }

    // ---------------------------------------------------------------
    // 13. Walk controls: keyboard (computer) + arrow pad (touch)
    // ---------------------------------------------------------------
    var KEY_DIR = {
      arrowup: 'up', w: 'up', z: 'up',            // z / q: French AZERTY keyboards
      arrowdown: 'down', s: 'down',
      arrowleft: 'left', a: 'left', q: 'left',
      arrowright: 'right', d: 'right'
    };
    function onKey(e, down) {
      if (S.cam !== 'walk') return;
      var dir = KEY_DIR[e.key.toLowerCase()];
      if (!dir) return;
      e.preventDefault();
      keys[dir] = down;
    }
    window.addEventListener('keydown', function (e) { onKey(e, true); });
    window.addEventListener('keyup', function (e) { onKey(e, false); });
    window.addEventListener('blur', function () { keys = {}; });

    document.querySelectorAll('#pad button').forEach(function (btn) {
      var dir = btn.dataset.dir;
      function press(e) {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        keys[dir] = true;
        btn.classList.add('held');
      }
      function release() {
        keys[dir] = false;
        btn.classList.remove('held');
      }
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('lostpointercapture', release);
      btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });

    // ---------------------------------------------------------------
    // 14. Buttons and sliders
    // ---------------------------------------------------------------
    function setPanel(open) {
      S.panelOpen = open;
      if (open && !isWide()) S.zoneId = null;   // one bottom sheet at a time
      highlightZone();
      refreshUI();
    }

    function setView(view) {
      S.view = view;
      S.zoneId = null;
      rebuildTrees();   // tree colors and markers depend on the view
      highlightZone();
    }

    function setCam(cam) {
      S.cam = cam;
      keys = {};
      pointers = {};
      if (cam === 'walk') {
        resetWalker();
        S.zoneId = null;
        if (!isWide()) S.panelOpen = false;
        // So the arrow keys move the walker, not the focused button.
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      }
      highlightZone();
      refreshUI();
    }

    $('btnSettings').onclick = function () { setPanel(!S.panelOpen); };
    $('btnClose').onclick = function () { setPanel(false); };
    $('zcClose').onclick = function () { openZone(null); };
    $('zcUpgrade').onclick = function () { tellFlutter('looz:upgrade'); };   // the app opens the plans screen
    $('btnWalk').onclick = function () { setCam(S.cam === 'walk' ? 'orbit' : 'walk'); };
    $('btnLabels').onclick = function () { S.labels = !S.labels; rebuildLabels(); rebuildMarkers(); refreshUI(); requestRender(); };
    $('btnReset').onclick = resetView;
    $('btnZones').onclick = function () { setView('zones'); };
    $('btnTrees').onclick = function () { setView('trees'); };
    $('btnReal').onclick = loadRealTrees;
    $('btnAI').onclick = function () { S.mode = 'ai'; generateLayout(); };
    // Planting by hand happens in the tree view.
    $('btnManual').onclick = function () { S.mode = 'manual'; if (S.view === 'zones') setView('trees'); else refreshUI(); };
    $('varMain').onclick = function () { S.variety = 'main'; refreshUI(); };
    $('varPoll').onclick = function () { S.variety = 'pollinizer'; refreshUI(); };
    $('btnClear').onclick = function () { S.trees = []; rebuildTrees(); };

    function sliderText(key) {
      return key === 'pollEvery' ? TXT.every + S.pollEvery : S[key] + TXT.meters;
    }
    function syncSliders() {
      document.querySelectorAll('input[data-key]').forEach(function (input) { input.value = S[input.dataset.key]; });
      document.querySelectorAll('[data-val]').forEach(function (el) { el.textContent = sliderText(el.dataset.val); });
    }
    document.querySelectorAll('input[data-key]').forEach(function (input) {
      var key = input.dataset.key;
      input.addEventListener('input', function () {
        S[key] = Number(input.value);
        document.querySelector('[data-val=' + key + ']').textContent = sliderText(key);
        if (key === 'plotW' || key === 'plotL') updatePlot();
        // In AI mode the layout follows the sliders right away.
        if (S.mode === 'ai') generateLayout();
      });
    });
    syncSliders();

    function toggle(id, on) { $(id).classList.toggle('on', on); }
    function show(id, visible) { $(id).classList.toggle('hidden', !visible); }

    var buttonsHidden = null;   // last message sent to Flutter

    function refreshUI() {
      var walking = S.cam === 'walk';
      var zonesView = S.view === 'zones';
      var zoneOpen = !!S.zoneId && zonesView && !walking;
      document.body.classList.toggle('panel-open', S.panelOpen && !walking);
      document.body.classList.toggle('zone-open', zoneOpen);
      zonesGroup.visible = zonesView;
      nodesGroup.visible = zonesView;

      toggle('btnSettings', S.panelOpen && !walking);
      toggle('btnWalk', walking);
      toggle('btnLabels', S.labels);
      toggle('btnZones', zonesView);
      toggle('btnTrees', !zonesView);
      toggle('btnReal', S.mode === 'real');
      toggle('btnAI', S.mode === 'ai');
      toggle('btnManual', S.mode === 'manual');
      toggle('varMain', S.variety === 'main');
      toggle('varPoll', S.variety === 'pollinizer');
      show('btnSettings', !walking && !REAL);
      show('viewSwitch', ZONES.length > 0);
      show('btnReal', !!DATA);
      show('manualBox', S.mode === 'manual');
      show('aiBox', S.mode === 'ai');
      show('pad', walking);

      // The walk button becomes "back to the 3D view" while walking.
      var walkBtn = $('btnWalk');
      setIcon(walkBtn.querySelector('svg'), walking ? 'cube' : 'walk');
      walkBtn.querySelector('span').textContent = walking ? TXT.view : TXT.walk;

      var main = 0;
      S.trees.forEach(function (t) { if (t.variety === 'main') main++; });
      $('nMain').textContent = main;
      $('nPoll').textContent = S.trees.length - main;
      $('modeText').textContent = walking ? TXT.modeWalk
        : { real: TXT.modeReal, ai: TXT.modeAI, manual: TXT.modeManual }[S.mode];
      $('hint').textContent = walking ? (isTouch ? '' : TXT.hintWalk)
        : zonesView ? TXT.hintZones
        : S.mode === 'manual' ? TXT.hintManual : TXT.hintOrbit;
      canvas.style.cursor = walking ? 'default'
        : (zonesView ? 'pointer' : (S.mode === 'manual' ? 'crosshair' : 'grab'));

      // When a panel would sit under Flutter's camera + assistant buttons
      // (bottom right), ask Flutter to hide them meanwhile.
      var hide = !walking && ((S.panelOpen && !isWide()) || (zoneOpen && window.innerWidth < 1000));
      if (hide !== buttonsHidden) {
        buttonsHidden = hide;
        tellFlutter(hide ? 'looz:buttons:hide' : 'looz:buttons:show');
      }
      requestRender();
    }

    // Android / iOS: JavaScript channel "LoozFlutter" added by the WebView.
    // Flutter web: the page is in an iframe, so we post to the parent window.
    var embedded = !!window.LoozFlutter || window.parent !== window;
    function tellFlutter(message) {
      try {
        if (window.LoozFlutter) window.LoozFlutter.postMessage(message);
        else if (window.parent !== window) window.parent.postMessage(message, '*');
      } catch (err) { /* not inside the app: nothing to do */ }
    }

    // ---------------------------------------------------------------
    // 15. Start
    // ---------------------------------------------------------------
    updatePlot();
    resetView();
    refreshUI();
    frame();
    tellFlutter('looz:ready');
    // Opened alone (or the app sent nothing): show an AI layout.
    setTimeout(function () { if (!DATA) generateLayout(); }, embedded ? 1500 : 0);
  })();
  </script>
</body>
</html>
